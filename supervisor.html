<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Night Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column phone app. Solid colour masthead, square-edged controls with hard shadows,
   views for Tonight, Calendar, Hotel and Hotel monthly plan, fixed bottom tab bar.
   Dark-first because it is used on night shifts; the light theme mirrors it. */
:root {
  --bg: #0b1020;
  --surface: #131a30;
  --surface-2: #1b2442;
  --line: #2d3a68;
  --fg: #f2f5ff;
  --muted: #9aa7cc;
  --accent: #3d6bff;
  --accent-ink: #ffffff;
  --accent-text: #86a9ff;
  --accent-soft: rgba(61, 107, 255, 0.22);
  --pop: #ffd23f;
  --pop-ink: #1a1400;
  --warn: #ff9a3d;
  --warn-soft: rgba(255, 154, 61, 0.16);
  --crit: #ff5a6e;
  --crit-soft: rgba(255, 90, 110, 0.18);
  --shadow: #000000;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f5ff;
    --surface: #ffffff;
    --surface-2: #e4e9ff;
    --line: #bfc9ee;
    --fg: #10183a;
    --muted: #55608a;
    --accent: #2456f5;
    --accent-ink: #ffffff;
    --accent-text: #1c44cc;
    --accent-soft: rgba(36, 86, 245, 0.12);
    --pop: #ffd23f;
    --pop-ink: #1a1400;
    --warn: #b84f00;
    --warn-soft: rgba(255, 140, 30, 0.16);
    --crit: #cc2238;
    --crit-soft: rgba(204, 34, 56, 0.10);
    --shadow: #10183a;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f5ff;
  --surface: #ffffff;
  --surface-2: #e4e9ff;
  --line: #bfc9ee;
  --fg: #10183a;
  --muted: #55608a;
  --accent: #2456f5;
  --accent-ink: #ffffff;
  --accent-text: #1c44cc;
  --accent-soft: rgba(36, 86, 245, 0.12);
  --pop: #ffd23f;
  --pop-ink: #1a1400;
  --warn: #b84f00;
  --warn-soft: rgba(255, 140, 30, 0.16);
  --crit: #cc2238;
  --crit-soft: rgba(204, 34, 56, 0.10);
  --shadow: #10183a;
  color-scheme: light;
}

:root {
  /* Scales up on tablets, then stops at 19px so laptops get a stable view. */
  font-size: clamp(17px, 0.5vw + 15px, 19px);
  --gl: max(16px, env(safe-area-inset-left, 0px), calc((100vw - 60rem) / 2));
  --gr: max(16px, env(safe-area-inset-right, 0px), calc((100vw - 60rem) / 2));
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 0.9375rem;
  line-height: 1.45;
  padding-left: var(--gl);
  padding-right: var(--gr);
  padding-block: 0 6.5rem;
  min-height: 100vh;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--accent);
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent-text); }
:focus-visible { outline: 3px solid var(--pop); outline-offset: 2px; }
.mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

/* Masthead: full-bleed colour band */
.mast {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--accent);
  color: var(--accent-ink);
  margin-left: calc(-1 * var(--gl));
  margin-right: calc(-1 * var(--gr));
  padding: 0.75rem var(--gr) 0.75rem var(--gl);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.375rem 0.75rem;
}
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1; }
.brand small { font-family: var(--font-data); font-weight: 500; font-size: 0.6875rem; opacity: 0.85; margin-left: 0.5rem; letter-spacing: 0.08em; }
.badge-demo {
  font-family: var(--font-data);
  font-size: 0.6875rem;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 4px 0.5rem;
  background: var(--pop);
  color: var(--pop-ink);
  white-space: nowrap;
}

main { padding-top: 1.25rem; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 2.125rem; line-height: 1.05; margin: 0; text-wrap: balance; text-transform: uppercase; letter-spacing: 0.005em; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 0.875rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-text); margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0.5rem 0 0; }

/* Status strip */
.strip { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 1.125rem; border: 2px solid var(--fg); background: var(--surface); }
.strip > div { padding: 0.625rem 0 0.625rem 0.75rem; border-left: 2px solid var(--fg); min-width: 0; }
.strip > div:first-child { border-left: 0; }
.strip b { display: block; font-family: var(--font-data); font-weight: 500; font-size: 1.875rem; line-height: 1.1; }
.strip span { font-size: 0.6875rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.strip .is-warn b { color: var(--warn); }
.strip .is-crit b { color: var(--crit); }

/* Shift rows */
.rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 20rem), 1fr)); gap: 0.75rem; margin-top: 1rem; }
.row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 4px 0.75rem;
  align-items: center;
  width: 100%;
  text-align: left;
  background: var(--surface);
  border: 2px solid var(--line);
  padding: 0.75rem 0.875rem;
  box-shadow: 4px 4px 0 var(--shadow);
}
.row:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--shadow); }
.row .name { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; line-height: 1.15; text-transform: uppercase; }
.row .meta { color: var(--muted); font-size: 0.8125rem; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 0.5rem; margin-top: 3px; }
.row .time { font-family: var(--font-data); font-size: 0.8125rem; font-weight: 500; text-align: right; }
.row .side { display: flex; flex-direction: column; align-items: flex-end; gap: 0.375rem; }
.person { color: var(--fg); font-weight: 500; }
.person.gap { color: var(--crit); }

.pill {
  font-family: var(--font-data);
  font-size: 0.6875rem;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 2px 0.4375rem;
  white-space: nowrap;
  border: 2px solid transparent;
}
.pill.warn { background: var(--warn); color: #1a0c00; border-color: var(--warn); }
.pill.crit { background: var(--crit); color: #ffffff; border-color: var(--crit); }
.pill.neutral { background: var(--surface-2); color: var(--muted); border-color: var(--line); }
.chip { font-family: var(--font-data); font-size: 0.75rem; padding: 1px 0.4375rem; background: var(--accent-soft); color: var(--accent-text); font-weight: 500; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  min-height: 2.875rem; padding: 0 1.125rem;
  border: 2px solid var(--fg);
  background: var(--surface); color: var(--fg);
  text-decoration: none; font-family: var(--font-display); font-weight: 700; font-size: 1rem; letter-spacing: 0.06em; text-transform: uppercase;
  box-shadow: 4px 4px 0 var(--shadow);
}
.btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--shadow); }
.btn.primary { background: var(--pop); color: var(--pop-ink); border-color: var(--pop-ink); }
.btn.small { min-height: 2.25rem; padding: 0 0.75rem; font-size: 0.875rem; box-shadow: 3px 3px 0 var(--shadow); }
.actions { display: flex; flex-wrap: wrap; gap: 0.875rem; margin-top: 1.125rem; }
.icon-btn { width: 2.875rem; height: 2.875rem; border: 2px solid var(--fg); background: var(--surface); font-size: 1.375rem; line-height: 1; font-weight: 700; box-shadow: 3px 3px 0 var(--shadow); }
.icon-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow); }

/* Hotel detail */
.back { background: none; border: 0; padding: 0.375rem 0; color: var(--accent-text); font-family: var(--font-display); font-weight: 700; font-size: 1rem; letter-spacing: 0.06em; text-transform: uppercase; display: inline-flex; gap: 0.375rem; align-items: center; }
.alert-box { margin-top: 1rem; padding: 0.75rem 0.875rem; background: var(--warn-soft); border: 2px solid var(--warn); }
.alert-box.crit { background: var(--crit-soft); border-color: var(--crit); }
.alert-box strong { display: block; font-family: var(--font-display); font-size: 0.875rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--warn); }
.alert-box.crit strong { color: var(--crit); }
.alert-box p { margin: 4px 0 0; }
dl.facts { margin: 1.5rem 0 0; display: grid; grid-template-columns: 1fr; border-top: 2px solid var(--fg); }
dl.facts > div { display: grid; grid-template-columns: 7rem minmax(0, 1fr); gap: 0.75rem; padding: 0.6875rem 0; border-bottom: 1px solid var(--line); }
dl.facts dt { color: var(--muted); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; padding-top: 3px; font-weight: 500; }
dl.facts dd { margin: 0; overflow-wrap: anywhere; }
.assigned-name { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; text-transform: uppercase; line-height: 1.1; }
.links { display: flex; flex-wrap: wrap; gap: 0.375rem 1rem; margin-top: 0.375rem; }
.links a, .links button.linklike { font-weight: 600; }
.linklike { background: none; border: 0; padding: 0; color: var(--accent-text); text-decoration: underline; font-weight: 600; }
.copy { background: none; border: 0; color: var(--accent-text); padding: 0 0 0 0.5rem; font-size: 0.8125rem; text-decoration: underline; }

.notes-head { display: flex; align-items: baseline; justify-content: space-between; margin-top: 1.875rem; }
.note-form { margin-top: 0.625rem; display: grid; gap: 0.625rem; }
textarea {
  width: 100%; min-height: 4.75rem; resize: vertical;
  background: var(--surface); border: 2px solid var(--fg); padding: 0.625rem 0.75rem;
}
textarea::placeholder { color: var(--muted); }
.note-form .btn { justify-self: start; }
.note { padding: 0.75rem 0; border-bottom: 1px solid var(--line); }
.note p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.note .by { display: flex; flex-wrap: wrap; gap: 4px 0.625rem; align-items: center; margin-top: 0.375rem; font-size: 0.75rem; color: var(--muted); font-family: var(--font-data); }
.fine { font-size: 0.75rem; color: var(--muted); margin-top: 0.625rem; }

/* Calendar */
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
.cal-head h1 { font-size: 1.75rem; text-align: center; }
.dow, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dow { margin-top: 1.125rem; font-family: var(--font-data); font-size: 0.6875rem; color: var(--muted); text-align: center; letter-spacing: 0.06em; text-transform: uppercase; }
.grid { margin-top: 0.375rem; }
.day {
  aspect-ratio: 1 / 1.08; max-width: 100%;
  background: var(--surface); border: 2px solid var(--line);
  display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  padding: 0.375rem 2px 0.4375rem; min-width: 0;
}
.day .n { font-family: var(--font-data); font-size: 0.875rem; font-weight: 500; }
.day .dots { display: flex; gap: 3px; min-height: 0.5rem; }
.dot { width: 0.5rem; height: 0.5rem; display: inline-block; }
.dot.warn { background: var(--warn); }
.dot.crit { background: var(--crit); }
.day.out { visibility: hidden; }
.day.today { border-color: var(--pop); }
.day.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.day.sel.today { border-color: var(--pop); }
.day.sel .dot { outline: 2px solid var(--accent-ink); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 1rem; margin-top: 0.75rem; font-size: 0.75rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 0.375rem; }
.day-list-head { margin-top: 1.75rem; }

/* Hotel monthly plan */
.plan { display: flex; flex-direction: column; margin-top: 1rem; border-top: 2px solid var(--fg); }
.plan-row {
  display: grid; grid-template-columns: 3.875rem minmax(0, 1fr) auto; gap: 0.625rem; align-items: center;
  width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 0.6875rem 0.375rem;
}
.plan-row .d { font-family: var(--font-data); font-weight: 500; font-size: 0.8125rem; color: var(--muted); }
.plan-row .who { font-weight: 600; }
.plan-row.today { background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--pop); }
.plan-row.weekend .d { color: var(--accent-text); }
.tally { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.625rem; }
.tally span { padding: 4px 0.5rem; border: 2px solid var(--line); background: var(--surface); font-size: 0.8125rem; }
.tally b { font-family: var(--font-data); font-weight: 500; margin-left: 4px; color: var(--accent-text); }

.plan-row .who-btn { background: none; border: 0; padding: 0; font-weight: 600; text-align: left; color: var(--accent-text); text-decoration: underline; font-size: 0.9375rem; }
.plan-row .end { display: flex; align-items: center; gap: 0.625rem; }
.plan-row .open { background: none; border: 0; padding: 0 2px; font-size: 1.25rem; font-weight: 700; color: var(--fg); line-height: 1; }
.plan-row.off .who { color: var(--muted); font-weight: 400; }
.plan-row .t { font-family: var(--font-data); font-size: 0.75rem; color: var(--muted); }
.sect { margin-top: 1.75rem; }
.emp-head { margin-top: 0.375rem; }

/* Tab bar */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.5rem;
  padding: 0.625rem var(--gr) calc(0.625rem + env(safe-area-inset-bottom, 0px)) var(--gl);
  background: var(--surface); border-top: 2px solid var(--fg);
}
.tab { min-height: 3rem; border: 2px solid var(--line); background: var(--bg); color: var(--muted); font-family: var(--font-display); font-weight: 700; font-size: 1.0625rem; letter-spacing: 0.08em; text-transform: uppercase; }
.tab[aria-current="page"] { background: var(--pop); color: var(--pop-ink); border-color: var(--pop-ink); box-shadow: 3px 3px 0 var(--shadow); }

/* Staffing badge: planned / ordered */
.xy { font-family: var(--font-data); font-weight: 500; font-size: 0.8125rem; line-height: 1.3; padding: 1px 0.5rem; border-radius: 999px; border: 2px solid var(--accent); background: var(--accent-soft); color: var(--accent-text); white-space: nowrap; font-variant-numeric: tabular-nums; }
.xy.part { border-color: var(--warn); background: var(--warn-soft); color: var(--warn); }
.xy.none { border-color: var(--crit); background: var(--crit-soft); color: var(--crit); }

/* Calendar cells */
.day { aspect-ratio: 1 / 1.2; }
.day .xy { font-size: 0.6875rem; padding: 0 0.3125rem; border-width: 1px; }
.day.sel .xy { background: var(--bg); color: var(--fg); border-color: var(--bg); }
.day.sel .xy.part { border-color: var(--warn); }
.day.sel .xy.none { border-color: var(--crit); }
.day .foot { display: flex; align-items: center; justify-content: center; gap: 0.25rem; min-height: 0.75rem; }
.grid.tall .day { aspect-ratio: auto; min-height: 5.75rem; }
.names { display: flex; flex-direction: column; align-items: center; gap: 1px; width: 100%; font-size: 0.6875rem; line-height: 1.2; text-align: center; }
.names span { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.names .nobody { color: var(--crit); font-weight: 600; }
.code { font-family: var(--font-display); font-weight: 700; font-size: 1rem; letter-spacing: 0.04em; padding: 0.125rem 0.4375rem; border-radius: 8px; background: var(--accent-soft); color: var(--accent-text); }
.day.offcell { background: transparent; border-style: dashed; color: var(--muted); }
.day.offcell .offtxt { font-size: 0.6875rem; letter-spacing: 0.06em; text-transform: uppercase; }
.legend .code { font-size: 0.75rem; padding: 0 0.3125rem; }

/* Toolbar with Table / Calendar switch */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
.seg { display: inline-flex; flex: none; border: 2px solid var(--fg); border-radius: 14px; overflow: hidden; background: var(--surface); box-shadow: 3px 3px 0 var(--shadow); }
.seg button { border: 0; background: none; color: var(--muted); padding: 0 0.875rem; min-height: 2.5rem; font-family: var(--font-display); font-weight: 700; font-size: 0.9375rem; letter-spacing: 0.06em; text-transform: uppercase; }
.seg button + button { border-left: 2px solid var(--fg); }
.seg button[aria-pressed="true"] { background: var(--pop); color: var(--pop-ink); }
.person-block + .person-block { margin-top: 0.875rem; }
.open-line { margin-top: 0.625rem; color: var(--crit); font-weight: 600; }
.plan-row .sepc { color: var(--muted); }
.sub .xy { margin-left: 0.25rem; }

/* Employee change sheet */
body.lock { overflow: hidden; }
.btn.wide { width: 100%; margin-top: 1.125rem; }
.btn.change { background: var(--accent); color: var(--accent-ink); border-color: var(--fg); }
.pill.ok { background: var(--accent-soft); color: var(--accent-text); border-color: var(--accent); }
.alert-box.pend { background: var(--accent-soft); border-color: var(--accent); }
.alert-box.pend strong { color: var(--accent-text); }
.alert-box.pend .linklike { margin-top: 0.375rem; }
.sheet { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(5, 8, 20, 0.62); }
.sheet-panel {
  position: relative; width: 100%; max-width: 44rem; max-height: 94%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--bg); border: 2px solid var(--fg); border-bottom: 0; border-radius: 20px 20px 0 0; outline: none;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(1.25rem + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet-head { position: sticky; top: 0; z-index: 2; background: var(--bg); display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem; padding: 1rem 0 0.75rem; border-bottom: 2px solid var(--line); }
.sheet-head h2 { font-size: 1.5rem; color: var(--fg); letter-spacing: 0.02em; margin: 0; }
.sheet-sub { color: var(--muted); margin: 2px 0 0; font-size: 0.875rem; }
.lbl { font-family: var(--font-display); font-weight: 700; font-size: 0.8125rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-text); margin: 1.125rem 0 0.5rem; }
.pickrow { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.pick { padding: 0.5rem 0.9rem; min-height: 2.5rem; border: 2px solid var(--line); border-radius: 999px; background: var(--surface); font-weight: 600; }
.pick[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.togs { display: grid; gap: 0.5rem; }
.tog { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; width: 100%; text-align: left; padding: 0.7rem 0.9rem; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; }
.tog .tt { display: block; font-family: var(--font-display); font-weight: 700; font-size: 1.0625rem; text-transform: uppercase; letter-spacing: 0.04em; }
.tog .td { display: block; color: var(--muted); font-size: 0.8125rem; margin-top: 2px; }
.tog .sw { flex: none; position: relative; width: 2.75rem; height: 1.5rem; border-radius: 999px; background: var(--surface-2); border: 2px solid var(--line); }
.tog .sw::after { content: ""; position: absolute; top: 50%; left: 2px; width: 1rem; height: 1rem; transform: translateY(-50%); border-radius: 50%; background: var(--muted); }
.tog[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }

  /* ---------- Sheet view: the Auftragsbestätigung layout for one hotel and month ---------- */
  var DE_DOW = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
  var fmtMonthDe = new Intl.DateTimeFormat("de-DE", { month: "long" });
  /* "Ein" marks a person's first night at a hotel they have no history with, counted from tonight on. */
  function firstNightsAt(hid, upTo) {
    var out = {};
    function hist(id) { return EXP[id] && EXP[id].hotels && EXP[id].hotels[hid]; }
    for (var dt = tonight; dt <= upTo; dt = addDays(dt, 1)) {
      entryFor(dt, hid).emps.forEach(function (id) { if (!hist(id) && !out[id]) out[id] = keyOf(dt); });
    }
    return out;
  }
  function sheetBody(h, y, m, days) {
    var first = firstNightsAt(h.id, new Date(y, m, days)), info = [], ids = {};
    for (var d = 1; d <= days; d++) {
      var date = new Date(y, m, d), r = entryFor(date, h.id);
      info.push({ d: d, date: date, k: keyOf(date), r: r });
      r.emps.forEach(function (id) { ids[id] = 1; });
    }
    var people = Object.keys(ids).sort(function (a, b) { return EMP[a].name.localeCompare(EMP[b].name); });
    var blanks = Math.max(2, 5 - people.length);
    function cl(di, extra) {
      var w = di.date.getDay(), c = (w === 0 || w === 6 ? "we " : "") + (di.k === keyOf(tonight) ? "tod " : "") + (extra || "");
      return c.trim() ? ' class="' + c.trim() + '"' : "";
    }
    var h1 = '<tr><th class="nm">' + fmtMonthDe.format(new Date(y, m, 1)) + '</th>', h2 = '<tr><th class="nm">' + y + '</th>', h3 = '<tr class="dienst"><th class="nm">Dienst</th>', kn = '<tr class="kn"><td class="nm">Kontrolle</td>';
    info.forEach(function (di) {
      h1 += '<th' + cl(di) + '><button class="dn" data-hotel="' + h.id + '" data-date="' + di.k + '" aria-label="Open hotel page for ' + fmtLong.format(di.date) + '">' + di.d + '.</button></th>';
      h2 += '<th' + cl(di) + '>' + DE_DOW[di.date.getDay()] + '</th>';
      h3 += '<th' + cl(di) + '>' + (di.r.need > 0 ? "N" : "") + '</th>';
      kn += '<td' + cl(di, di.r.emps.length < di.r.need ? "gap" : "") + '>' + di.r.emps.length + '</td>';
    });
    var rows = people.map(function (id) {
      var tr = '<tr><td class="nm"><button class="who-btn" data-emp="' + id + '">' + esc(EMP[id].name) + '</button></td>';
      info.forEach(function (di) {
        var v = "", c = "";
        if (di.r.emps.indexOf(id) !== -1) { v = first[id] === di.k ? "Ein" : "x"; c = v === "Ein" ? "ein" : "x"; }
        else if (isBlocked(di.k, id)) { v = "oo"; c = "oo"; }
        tr += '<td' + cl(di, c) + '>' + v + '</td>';
      });
      return tr + '</tr>';
    }).join("");
    for (var b = 0; b < blanks; b++) {
      rows += '<tr><td class="nm"></td>' + info.map(function (di) { return '<td' + cl(di) + '></td>'; }).join("") + '</tr>';

    var addr = h.address.split(/,\s*/), t0 = h.start.replace(/^0/, ""), t1 = h.end.replace(/^0/, ""), tm = t0 + " bis " + t1 + " Uhr";
    return '<div class="sheetdoc">' +
      '<div class="sd-top"><span class="sd-title">Auftragsbestätigung</span><span>Einzelnachweis zum Rahmenvertrag vom 01.07.2025</span></div>' +
      '<div class="sd-cols">' +
        '<div class="sd-blk"><b>Verleiher:</b>Nachtdienst Beispiel GmbH<br>Musterstraße 1<br>10115 Berlin<br>Tel: 030 555 0100<br>Mail: dispatch@example.com<br>Ihr Ansprechpartner: <b class="in">Dispatch (Demo)</b></div>' +
        '<div class="sd-blk"><b>Entleiher:</b>' + esc(h.name) + '<br>' + esc(addr[0]) + '<br>' + esc(addr.slice(1).join(", ")) + '<br>Tel: ' + esc(h.phone) + '</div>' +
      '</div>' +
      '<p class="sd-p">Wir stellen Ihnen folgende Mitarbeiter als Leiharbeitnehmer, in den genannten Zeiträumen, zur Verfügung:</p>' +
      '<div class="sd-scroll"><table class="sd" aria-label="Einsatzplan ' + esc(h.name) + ', ' + fmtMonth.format(new Date(y, m, 1)) + '"><thead>' + h1 + '</tr>' + h2 + '</tr>' + h3 + '</tr></thead><tbody>' + rows + kn + '</tr></tbody></table></div>' +
      '<div class="sd-legend"><p><b>Dienstzeiten:</b> Tätigkeitsprofile laut Rahmenvertrag: F, M, N, P, S</p>' +
        '<div class="sd-lg"><span>N</span><span>=</span><span>' + tm + '</span><span class="pz">es wird eine Pause gewährt von: –</span>' +
        '<span>EIN</span><span>=</span><span>' + tm + '</span><span class="pz">es wird eine Pause gewährt von: –</span>' +
        '<span>oo</span><span>=</span><span class="wide">Sperrdaten der Mitarbeiter</span></div></div>' +

  function renderPlan() {

      '<div class="strip">' +

      '<h2 class="emp-head">Employee plan</h2>' +
      '<h1>' + esc(e.name) + '</h1>' +
      '<div class="links" style="margin-top:8px"><a href="' + telHref(e.phone) + '" class="mono">' + esc(e.phone) + '</a>' +
      '<button class="linklike" data-copy="' + esc(e.phone) + '">Copy number</button></div>' +
      '<div class="cal-head" style="margin-top:18px"><button class="icon-btn" data-empmonth="-1" aria-label="Previous month">&#8249;</button>' +
      '<h1 style="font-size:1.625rem">' + fmtMonth.format(state.empMonth) + '</h1>' +
      '<button class="icon-btn" data-empmonth="1" aria-label="Next month">&#8250;</button></div>' +
      '<div class="strip">' +
        '<div><b>' + shifts + '</b><span>Shifts</span></div>' +
        '<div><b>' + (days - shifts) + '</b><span>Days off</span></div>' +
        '<div><b>' + Object.keys(byHotel).length + '</b><span>Hotels</span></div></div>' +
      '<div class="tally">' + tallyHtml + '</div>' + body +
      '</section>';
  }

  /* ---------- Employee change: ranked replacements for one hotel night ---------- */
  function agoText(d) {
    if (d <= 0) return "today";
    if (d === 1) return "yesterday";
    if (d < 60) return d + " days ago";
    return Math.round(d / 30) + " months ago";
  }

  /* Software and hotel experience, with the reasons that produced the score. */
  function matchFor(empId, hotel) {
    var sys = EXP[empId].systems, pts = 0, soft = null;
    if (sys[hotel.pms]) {
      soft = { kind: "same", name: hotel.pms, level: sys[hotel.pms] };
      pts += sys[hotel.pms] === "daily" ? 40 : 25;
    } else {
      var fam = FAMILY[hotel.pms];
      Object.keys(sys).forEach(function (n) {
        if (fam && FAMILY[n] === fam && (!soft || sys[n] === "daily")) soft = { kind: "related", name: n, level: sys[n] };
      });
      if (soft) pts += soft.level === "daily" ? 20 : 12;
    }
    var hx = EXP[empId].hotels[hotel.id] || null;
    if (hx) pts += Math.min(40, hx.nights * 2.5) + (hx.last <= 30 ? 10 : hx.last <= 90 ? 5 : 0);
    return { soft: soft, hotel: hx, score: pts };
  }

  /* Everyone who could cover this night. The 9-month rule removes people before any filter runs. */
  function candidates(date, hotelId, outId) {
    var hotel = hotelById(hotelId), k = keyOf(date), r = entryFor(date, hotelId);
    var list = [], hidden = 0;
    Object.keys(EMP).forEach(function (id) {
      if (id === outId || r.emps.indexOf(id) !== -1) return;
      if (isRestricted(id, hotelId)) { hidden++; return; }
      var where = shiftOf(id, date);
      list.push({ id: id, m: matchFor(id, hotel), where: where ? where.hotel : null,
                  status: where ? "elsewhere" : isBlocked(k, id) ? "blocked" : "free" });
    });
    return { list: list, hidden: hidden };
  }

  function candHtml(c, date) {
    var e = EMP[c.id], m = c.m, h = hotelById(state.hotel);
    var tier = m.score >= 70 ? ["best", "Best match"] : m.score >= 40 ? ["good", "Good fit"] : m.score > 0 ? ["poss", "Possible"] : ["none", "No match"];
    var pill = c.status === "free" ? '<span class="pill ok">Free</span>'
      : c.status === "blocked" ? '<span class="pill crit">Gesperrt</span>' : '<span class="pill neutral">Working</span>';
    var soft = m.soft
      ? '<span class="rs hit">' + (m.soft.kind === "same" ? "Same system" : "Related system") + ' · ' + esc(m.soft.name) + ' · ' + m.soft.level + '</span>'
      : '<span class="rs miss">No ' + esc(h.pms) + ' experience</span>';
    var hot = m.hotel
      ? '<span class="rs hit">Hotel · ' + m.hotel.nights + ' nights · ' + agoText(m.hotel.last) + '</span>'
      : '<span class="rs miss">Never worked here</span>';
    var sys = EXP[c.id].systems;
    var others = Object.keys(sys).filter(function (n) { return !m.soft || n !== m.soft.name; })
      .map(function (n) { return esc(n) + ' (' + sys[n] + ')'; });
    var note = c.status === "blocked" ? '<p class="cnote">Blocked this date. You would be asking for a favour.</p>'
      : c.status === "elsewhere" ? '<p class="cnote">Working at ' + esc(c.where.name) + (diffDays(date, tonight) === 0 ? ' tonight.' : ' that night.') + '</p>' : "";
    return '<article class="cand' + (c.status === "elsewhere" ? " dim" : "") + '">' +
      '<div class="cand-top"><div><div class="cand-name">' + esc(e.name) + '</div><span class="tier ' + tier[0] + '">' + tier[1] + '</span></div>' + pill + '</div>' +
      '<div class="reasons">' + soft + hot + '</div>' +
      (others.length ? '<p class="also">Also knows: ' + others.join(", ") + '</p>' : "") + note +
      '<div class="cand-foot"><a class="mono phone" href="' + telHref(e.phone) + '">' + esc(e.phone) + '</a></div>' +
      '<div class="cand-actions"><button class="btn small" data-copy="' + esc(e.phone) + '">Copy number</button>' +
      (c.status === "elsewhere" ? "" : '<button class="btn small primary" data-propose="' + c.id + '">Propose</button>') + '</div></article>';
  }

  function sheetHtml() {
    var s = state.sheet, date = state.date;
    var r = entryFor(date, state.hotel), h = r.hotel, open = r.need - r.emps.length;
    var outId = s.out === "slot" ? null : s.out;
    var picks = r.emps.map(function (id) {
      return '<button class="pick" data-out="' + id + '" aria-pressed="' + (s.out === id) + '">' + esc(EMP[id].name) + '</button>';
    }).join("");
    if (open > 0) picks += '<button class="pick" data-out="slot" aria-pressed="' + (s.out === "slot") + '">Open slot' + (open > 1 ? "s" : "") + '</button>';

    var res = candidates(date, h.id, outId);
    function rank(c) { return c.status === "free" ? 0 : c.status === "blocked" ? 1 : 2; }
    var shown = res.list.filter(function (c) {
      return (!s.soft || c.m.soft) && (!s.hot || c.m.hotel) && (c.status !== "blocked" || s.blocked);
    }).sort(function (a, b) {
      return rank(a) - rank(b) || b.m.score - a.m.score || EMP[a.id].name.localeCompare(EMP[b.id].name);
    });
    var nFree = shown.filter(function (c) { return c.status === "free"; }).length;
    var nBlocked = shown.filter(function (c) { return c.status === "blocked"; }).length;
    var nElse = shown.filter(function (c) { return c.status === "elsewhere"; }).length;
    var summary = nFree + ' free' + (s.blocked ? ', ' + nBlocked + ' gesperrt' : '') + (nElse ? ', ' + nElse + ' working elsewhere' : '') +
      (res.hidden ? '. ' + res.hidden + ' hidden by the 9-month rule' : '');

    function tog(key, title, desc, extra) {
      return '<button class="tog' + (extra || "") + '" role="switch" aria-checked="' + !!s[key] + '" data-tog="' + key + '">' +
        '<span><span class="tt">' + title + '</span><span class="td">' + desc + '</span></span><span class="sw" aria-hidden="true"></span></button>';
    }
    return '<div class="sheet"><div class="sheet-backdrop" data-close="1"></div>' +
      '<section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">' +
      '<div class="sheet-head"><div><h2 id="sheet-title">Employee change</h2>' +
      '<p class="sheet-sub">' + esc(h.name) + ' · ' + fmtShort.format(date) + ' · ' + h.start + '–' + h.end + '</p></div>' +
      '<button class="icon-btn" data-close="1" aria-label="Close">&#10005;</button></div>' +
      '<h3 class="lbl">Replace</h3><div class="pickrow">' + picks + '</div>' +
      '<h3 class="lbl">Match by</h3><div class="togs">' +
        tog("soft", "Software experience", "Knows " + esc(h.pms) + " or a related system") +
        tog("hot", "Hotel experience", "Has worked at " + esc(h.name)) +
        tog("blocked", "Gesperrt", "Also show people who blocked this date", " warnish") +
      '</div>' +
      '<p class="count">' + summary + '</p>' +
      (shown.length ? '<div class="cands">' + shown.map(function (c) { return candHtml(c, date); }).join("") + '</div>'
        : '<p class="empty">No one matches. Turn off a filter, or switch on Gesperrt to include people who blocked this date.</p>') +
      '<p class="fine">Proposals go to dispatch. Nothing changes in the plan until they confirm. The 9-month rule is a hard filter and cannot be overridden here.</p>' +
      '</section></div>';
  }

  function renderSheet() {
    var s = state.sheet;
    if (document.body && document.body.classList) document.body.classList.toggle("lock", !!s);
    if (!s) { sheetEl.innerHTML = ""; return; }
    var old = sheetEl.querySelector ? sheetEl.querySelector(".sheet-panel") : null;
    var top = old ? old.scrollTop : 0;
    sheetEl.innerHTML = sheetHtml();
    var p = sheetEl.querySelector ? sheetEl.querySelector(".sheet-panel") : null;
    if (p) {
      p.scrollTop = top;
      if (s.fresh) { s.fresh = false; if (p.focus) p.focus({ preventScroll: true }); }
    }
  }
  function openSheet() {
    var r = entryFor(state.date, state.hotel), open = r.need - r.emps.length;
    state.sheet = { out: (open > 0 || !r.emps.length) ? "slot" : r.emps[0], soft: false, hot: false, blocked: false, fresh: true };
    renderSheet();
  }
  function closeSheet() { state.sheet = null; renderSheet(); }
  function propose(inn) {
    var s = state.sheet, k = keyOf(state.date);
    var dup = proposals.some(function (p) { return p.k === k && p.h === state.hotel && p.inn === inn; });
    if (!dup) proposals.push({ id: ++propSeq, k: k, h: state.hotel, out: s.out === "slot" ? null : s.out, inn: inn });
    closeSheet(); render(); window.scrollTo(0, 0);
  }

  function render() {
    var html = state.view === "tonight" ? renderTonight() : state.view === "calendar" ? renderCalendar() : state.view === "overview" ? renderOverview()
      : state.view === "plan" ? renderPlan() : state.view === "emp" ? renderEmp() : renderHotel();
    app.innerHTML = html;
    ["tonight", "calendar", "overview"].forEach(function (t) {
      var el = document.getElementById("tab-" + t);
      if (t === state.root) el.setAttribute("aria-current", "page"); else el.removeAttribute("aria-current");
    });
  }

  function parseKey(k) { var p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }

  /* ---------- Events ---------- */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-tab],[data-hotel],[data-day],[data-month],[data-planmonth],[data-empmonth],[data-plan],[data-emp],[data-style],[data-back],[data-copy],[data-sheet],[data-close],[data-out],[data-tog],[data-propose],[data-withdraw]");
    if (!t) return;
    if (t.dataset.tab) {
      state.stack = [];
      state.view = t.dataset.tab; state.root = t.dataset.tab;
      if (state.view === "tonight") state.date = tonight;
      render(); window.scrollTo(0, 0);
    } else if (t.dataset.sheet) {
      openSheet();
    } else if (t.dataset.close) {
      closeSheet();
    } else if (t.dataset.out) {
      state.sheet.out = t.dataset.out; renderSheet();
    } else if (t.dataset.tog) {
      state.sheet[t.dataset.tog] = !state.sheet[t.dataset.tog]; renderSheet();
    } else if (t.dataset.propose) {
      propose(t.dataset.propose);
    } else if (t.dataset.withdraw) {
      var wid = +t.dataset.withdraw;
      proposals = proposals.filter(function (p) { return p.id !== wid; });
      render();
    } else if (t.dataset.style) {
      state.style = t.dataset.style; render();
    } else if (t.dataset.hotel) {
      pushNav();                                     /* Back returns to the screen the tap came from */
      state.date = parseKey(t.dataset.date); state.hotel = t.dataset.hotel; state.view = "hotel";
      render(); window.scrollTo(0, 0);
    } else if (t.dataset.plan) {
      pushNav();
      state.planMonth = monthOfCurrent(); state.hotel = t.dataset.plan;
      state.view = "plan"; render(); window.scrollTo(0, 0);
    } else if (t.dataset.emp) {
      pushNav();
      state.empMonth = monthOfCurrent(); state.emp = t.dataset.emp;
      state.view = "emp"; render(); window.scrollTo(0, 0);
    } else if (t.dataset.empmonth) {
      state.empMonth = new Date(state.empMonth.getFullYear(), state.empMonth.getMonth() + (+t.dataset.empmonth), 1); render();
    } else if (t.dataset.day) {
      state.date = parseKey(t.dataset.day); render();
    } else if (t.dataset.month) {
      state.month = new Date(state.month.getFullYear(), state.month.getMonth() + (+t.dataset.month), 1); render();
    } else if (t.dataset.planmonth) {
      state.planMonth = new Date(state.planMonth.getFullYear(), state.planMonth.getMonth() + (+t.dataset.planmonth), 1); render();
    } else if (t.dataset.back) {
      var prev = state.stack.pop();
      if (prev) {
        state.view = prev.view; state.hotel = prev.hotel; state.emp = prev.emp; state.date = prev.date;
        state.planMonth = prev.planMonth; state.empMonth = prev.empMonth;
      } else state.view = state.root;
      render(); window.scrollTo(0, prev ? prev.y : 0);
    } else if (t.dataset.copy) {
      var text = t.dataset.copy, btn = t, label = btn.textContent;
      var done = function () { btn.textContent = "Copied"; setTimeout(function () { btn.textContent = label; }, 1400); };
      try { navigator.clipboard.writeText(text).then(done, function () { btn.textContent = "Select number"; }); }
      catch (err) { btn.textContent = "Select number"; }
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && state.sheet) closeSheet();
  });

  document.addEventListener("submit", function (e) {
    if (e.target.id !== "note-form") return;
    e.preventDefault();
    var ta = document.getElementById("note-text");
    var text = ta.value.trim();
    if (!text) { ta.focus(); return; }
    notes[state.hotel].unshift({ text: text, by: "You (demo)", at: new Date(), fresh: true });
    render();
  });

  render();
})();
</script>

</body></html>
